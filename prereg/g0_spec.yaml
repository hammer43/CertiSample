# A-G0: configuration-space breadth of native Rydberg constrained sampling.
# Pre-registered. Scientific changes require editing this file and re-freezing.
gate: A-G0
version: 3
changelog:
  - "v3 (before any Rydberg sample was drawn): fixed an internal inconsistency in the Rydberg arm. omega_max = 1.0 in QoolQit units gives a blockade radius of 1.0a, contradicting the stated 1.7a; Omega_max is now 1.7^-6 * J_nn. Schedule grid restated in drive units, DMM amplitude specified (it was missing), and the exact QutipEmulator backend (~4 h per 20-atom run) replaced by a blockade-subspace emulator with a pre-registered validation gate against exact Pulser. Noisy arm deferred. Classical arms, generator, epsilon rule, metrics and pass rule unchanged. Before this version was committed, a first run of the validation gate failed on one case (TV 0.0127, n = 12, schedule (40,4)); diagnosis showed the failure was the reference's own integration error at QuTiP default tolerances (default vs tight Pulser differ by TV 0.0109, while the full-space emulator matches tight Pulser to below 1e-5). The reference tolerances were tightened; the 0.005 threshold is unchanged."
  - "v2 (pilot landscapes only, no sampler data): |Omega| threshold 100 -> 50 and K 50 -> 20, keeping K/|Omega| near 0.25 while tightening eps from ~0.30 to ~0.20; co-primary B changed from swap-component coverage (degenerate: ~3 components, giant share 0.68-0.79) to within-radius coverage fraction."
question: >
  Does analog Rydberg sampling cover the exact near-optimal MWIS landscape better than
  the strongest Omega-blind classical sampler at the same proposal count?
claim_if_pass: >
  The analog Rydberg evolution exhibits broader near-optimal configuration-space coverage
  than the strongest tested Omega-blind classical sampler at the same proposal count.
  Not quantum advantage, not useful Benders cuts, not useful noise.

instances:
  generator:
    lattice: square
    side: 5                       # 5x5 = 25 sites
    occupied_sites: 20            # sampled uniformly without replacement
    blockade: chebyshev_leq_1     # edges between nearest and diagonal neighbours
    weights: {dist: uniform, low: 0.5, high: 1.0, normalize: max_equals_1}
  energy: "E(x) = -sum_i w_i x_i ; E* = min E over independent sets"
  split: {pilot: 20, test: 30}
  seeds: {pilot: [0, 19], test: [1000, 1029]}   # inclusive ranges, one graph per seed
  pilot_reuse: never              # pilot graphs never enter the test set

epsilon_rule:
  grid_relative: [0.0, 0.01, 0.02, 0.03, 0.05, 0.075, 0.10, 0.15, 0.20, 0.30, 0.50]
  omega: "Omega_eps = {x independent : E(x) <= E* + eps * |E*|}"
  min_size: 50
  select: "smallest grid value with |Omega_eps| >= min_size, computed per instance"
  if_none_qualifies: "use 0.50 and flag the instance"
  scoring_only: true              # Omega_eps never reaches any arm

arms:
  classical:
    randomized_greedy_ls:
      description: "weight/(deg+1) greedy with randomized tie band, then (1,2)-swap local search"
      grid: {tie_band: [0.0, 0.05, 0.10, 0.20], ls_rounds: [0, 20, 50]}
    constraint_aware_gibbs:
      description: "Gibbs sampling restricted to independent sets (single-site add/remove moves)"
      grid: {beta: [0.5, 1, 2, 4, 8, 16], sweeps: [50, 200], burn_in_sweeps: 100}
    simulated_annealing_is:
      description: "annealing on independent sets, geometric beta schedule"
      grid: {beta_final: [4, 8, 16, 32], sweeps: [100, 400]}
  quantum:
    rydberg_ideal:
      backend: "certisample.rydberg.Subspace: states with at most one nearest-neighbour excited pair kept exactly; states beyond eliminated adiabatically to second order"
      device: "pulser.devices.DigitalAnalogDevice, C6 = 5420158.53 rad um^6/us"
      register: "lattice spacing a = 5 um; Omega_max = 1.7^-6 * C6 / a^6 (~14.37 rad/us), so the blockade radius is 1.7a"
      schedule_family: >
        Omega(t): linear ramp 0 -> Omega_max over 10% of T (rounded to 4 ns), plateau, linear ramp to 0.
        delta(t): linear sweep -delta_final -> +delta_final over T.
        DMM: constant amplitude -delta_final with eps_i = 1 - w_i, so atom i's final effective
        detuning equals w_i * delta_final.
      grid: {duration_units: [5, 10, 20, 40], delta_final_units: [2, 4, 6]}
      units: "T = duration_units / Omega_max (rounded to 4 ns); delta_final = delta_final_units * Omega_max"
      readout: >
        K samples drawn from the final-state distribution. The evolution is deterministic, so
        replicates differ only in sampling seed: one simulation per (graph, schedule).
      feasibility: "samples are checked against the unit-disk graph; any blockaded pair counts as infeasible"
      validation:
        reference: "pulser_simulation.QutipEmulator (exact, full Hilbert space), same device, register and waveforms, run with QuTiP atol = 1e-12, rtol = 1e-10, nsteps = 1e7"
        cases: "first n atoms of pilot graphs 0 and 1; n = 12 with all 12 grid schedules; n = 14 with the shortest and longest schedules"
        metric: "total variation distance between final-state distributions"
        pass: "max TV <= 0.005 over all cases; if it fails, the Rydberg arm does not run"
    rydberg_noisy:
      status: "deferred: diagnostic only, not in the pass rule. Exact noisy emulation is infeasible at 20 atoms; its backend is specified in a later version before any noisy data is drawn."
  tuning:
    data: pilot_only
    objective: "mean rank across the two co-primaries on pilot graphs"
    rydberg_schedule: "chosen on pilots by the same objective, then frozen"

comparator_selection:
  pool: [randomized_greedy_ls, constraint_aware_gibbs, simulated_annealing_is]
  rule: "rank every tuned classical arm on every pilot instance on both co-primaries; lowest mean rank over 20 x 2 comparisons"
  tie_break: mean_nearest_jaccard
  frozen_before_test: true

sampling:
  K_primary: 20                    # raw proposals per replicate
  K_secondary_curve: [5, 10, 20, 40, 80]
  replicates_per_instance: 10
  replicate_seeds: [0, 9]
  S_definition: "unique(outputs) intersected with Omega_eps"
  report_separately: [infeasible_fraction, out_of_window_fraction, duplicate_fraction]

metrics:
  jaccard: "d_J(A,B) = 1 - |A intersect B| / |A union B| ; d_J(empty,empty) = 0"
  coprimary_A:
    name: mean_nearest_jaccard
    formula: "mean over y in Omega_eps of min over x in S of d_J(x,y)"
    better: lower
    empty_S: 1.0
  coprimary_B:
    name: radius_coverage_fraction
    radius_rule: "r(G) = median over y in Omega_eps of min over y' in Omega_eps, y' != y, of d_J(y, y'); fixed per instance from the landscape alone"
    formula: "fraction of y in Omega_eps with min over x in S of d_J(x, y) <= r(G)"
    better: higher
    empty_S: 0.0
  secondary: [swap_component_coverage, size_weighted_component_coverage, component_size_distribution,
              cardinality_distribution, hamming_mean_nearest, worst_case_jaccard_radius,
              unique_in_window, energy_distribution]
  reference_coverage:
    method: "exact K-center by radius bisection + CP-SAT set-cover feasibility"
    fallback: "farthest-first, labelled 'reference (approximate)' if CP-SAT times out"
    cpsat_time_limit_s: 120
    scoring_only: true
  pilot_diagnostic: "f_max = fraction of Omega_eps that is maximal; reported, no method change"

statistics:
  aggregation: "average replicates within instance first"
  deltas:
    delta_d: "mean_nearest_jaccard(comparator) - mean_nearest_jaccard(rydberg_ideal)"
    delta_c: "radius_coverage_fraction(rydberg_ideal) - radius_coverage_fraction(comparator)"
  bootstrap: {unit: test_instance, n_instances: 30, resamples: 10000, seed: 20260921, interval: 0.95}
  pass_rule: "LB95(delta_d) > 0 AND LB95(delta_c) > 0"   # intersection-union; no correction

resources:
  note: "K-matching is proposal matching, not computational matching"
  classical: [energy_evaluations, vertex_operations, cpu_seconds]
  quantum: [shots, pulse_duration, variational_evaluations, emulator_seconds]

on_fail: "retire the constrained-sampling track; build no recourse/cut machinery for it"
